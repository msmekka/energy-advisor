<!doctype html>
<head>
  <meta charset="utf-8">
  <title>AST Explorer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      background: #0B0B0B;
      color: #F5F0E6;
    }
    #source, #tree {
      flex: 1;
      height: 100vh;
      overflow: auto;
      box-sizing: border-box;
      padding: 12px;
    }
    #source {
      white-space: pre;
      border-right: 1px solid #333;
    }
    #source mark {
      background: #FFD200;
      color: #0B0B0B;
    }
    #tree details { margin-left: 14px; }
    #tree summary {
      cursor: pointer;
      list-style: none;
    }
    #tree summary::-webkit-details-marker { display: none; }
    #tree summary::before {
      content: "▸ ";
      color: #7ED321;
    }
    #tree details[open] > summary::before {
      content: "▾ ";
    }
    #tree .leaf {
      margin-left: 14px;
      cursor: pointer;
    }
    #tree .field { color: #29ABE2; }
    #tree .type { color: #F5F0E6; }
    #tree .anon { color: #888; }
    #tree .text { color: #FFD200; }
    #tree .leaf:hover, #tree summary:hover { background: #1a1a1a; }
  </style>
</head>
<body>
  <pre id="source"></pre>
  <div id="tree"></div>
  <script type="module" src="./mwast.js"></script>
</body>
</html>
