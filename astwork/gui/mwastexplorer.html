<!doctype html>
<head>
  <meta charset="utf-8">
  <title>AST Explorer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      background: #0B0B0B;
      color: #F5F0E6;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      box-sizing: border-box;
    }
    #file-input { color: #F5F0E6; }
    #file-name { color: #888; }
    #workspace {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #source, #tree {
      flex: 1;
      overflow: auto;
      box-sizing: border-box;
      padding: 12px;
    }
    #source {
      white-space: pre;
      border-right: 1px solid #333;
    }
    #source mark {
      background: #FFD200;
      color: #0B0B0B;
    }
    #tree details { margin-left: 14px; }
    #tree summary {
      cursor: pointer;
      list-style: none;
    }
    #tree summary::-webkit-details-marker { display: none; }
    #tree summary::before {
      content: "▸ ";
      color: #7ED321;
    }
    #tree details[open] > summary::before {
      content: "▾ ";
    }
    #tree .leaf {
      margin-left: 14px;
      cursor: pointer;
    }
    #tree .field { color: #29ABE2; }
    #tree .type { color: #F5F0E6; }
    #tree .anon { color: #888; }
    #tree .text { color: #FFD200; }
    #tree .leaf:hover, #tree summary:hover { background: #1a1a1a; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label for="file-input">Python source:</label>
    <input id="file-input" type="file" accept=".py,text/x-python,text/plain">
    <span id="file-name">Choose a file to explore</span>
  </div>
  <main id="workspace">
    <pre id="source"></pre>
    <div id="tree"></div>
  </main>
  <script type="module" src="./mwast.js"></script>
</body>
</html>
