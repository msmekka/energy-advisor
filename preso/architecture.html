<title>Three-Tier Pipeline</title>
<style>
  :root {
    --page-bg: #FAFAF8;
    --ink: #1B2430;
    --muted: #5B6472;
    --card-bg: #FFFFFF;
    --card-border: #D8D4CB;
    --tier1: #2E6F8E;
    --tier1-tint: #E4EEF2;
    --tier2: #6B5B95;
    --tier2-tint: #ECE8F3;
    --tier3: #C1562C;
    --tier3-tint: #F7E7DE;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #14171B;
      --ink: #E8E6E1;
      --muted: #9AA3AF;
      --card-bg: #1C1F24;
      --card-border: #343A42;
      --tier1: #6CB7D6;
      --tier1-tint: #1C2E36;
      --tier2: #B09FE0;
      --tier2-tint: #272136;
      --tier3: #E8905A;
      --tier3-tint: #3A2217;
    }
  }

  :root[data-theme="dark"] {
    --page-bg: #14171B;
    --ink: #E8E6E1;
    --muted: #9AA3AF;
    --card-bg: #1C1F24;
    --card-border: #343A42;
    --tier1: #6CB7D6;
    --tier1-tint: #1C2E36;
    --tier2: #B09FE0;
    --tier2-tint: #272136;
    --tier3: #E8905A;
    --tier3-tint: #3A2217;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 3rem 1.5rem 4rem;
    min-height: 100%;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--tier2);
  }

  h1 {
    font-size: clamp(1.4rem, 2.6vw, 1.9rem);
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
    text-align: center;
  }

  figure {
    margin: 0;
    width: min(1100px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .diagram-frame {
    width: 100%;
    overflow-x: auto;
  }

  svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  figcaption {
    max-width: 62ch;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  figcaption strong {
    color: var(--ink);
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">

<div class="eyebrow">eager-materialization &middot; project architecture</div>
<h1>Three tiers, increasing cost, decreasing frequency</h1>

<figure>
  <div class="diagram-frame">
    <svg viewBox="0 0 1200 820" role="img" aria-label="Pipeline with two built tiers and one reserved slot: a tree-sitter shape check runs continuously on every file, a Cachegrind confirmation tier is planned but not yet built, and an offline RAPL and wall-meter calibration runs rarely on a dedicated rig. The built tiers feed a Finding that is tagged with its source tier, emitted as JSON Lines or SARIF, and consumed by either a human in an editor or a code-generating agent.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"></path>
        </marker>
      </defs>

      <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">

        <!-- Tier 1 -->
        <rect x="40" y="40" width="340" height="170" rx="6" fill="var(--tier1-tint)" stroke="var(--tier1)" stroke-width="2"></rect>
        <text x="60" y="72" font-size="15" font-weight="600" fill="var(--ink)">Tier 1 &middot; Static Shape</text>
        <text x="60" y="96" font-size="12.5" fill="var(--muted)">tree-sitter query</text>
        <text x="60" y="120" font-size="12.5" fill="var(--muted)">continuous &middot; milliseconds</text>
        <text x="60" y="144" font-size="12.5" fill="var(--muted)">runs anywhere &mdash; VM-safe</text>
        <text x="60" y="168" font-size="12" font-style="italic" fill="var(--tier1)">shape only, no magnitude</text>

        <!-- Tier 2 (not built — reserved slot) -->
        <rect x="430" y="40" width="340" height="170" rx="6" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"></rect>
        <text x="450" y="72" font-size="15" font-weight="600" fill="var(--muted)">Tier 2 &middot; Confirm</text>
        <text x="450" y="96" font-size="12.5" fill="var(--muted)">Cachegrind counts</text>
        <text x="450" y="120" font-size="12.5" fill="var(--muted)">on demand &middot; per selection</text>
        <text x="450" y="144" font-size="12.5" fill="var(--muted)">runs anywhere &mdash; simulator</text>
        <text x="450" y="168" font-size="12" font-style="italic" fill="var(--muted)">planned &mdash; not built yet</text>

        <!-- Tier 3 -->
        <rect x="820" y="40" width="340" height="170" rx="6" fill="var(--tier3-tint)" stroke="var(--tier3)" stroke-width="2"></rect>
        <text x="840" y="72" font-size="15" font-weight="600" fill="var(--ink)">Tier 3 &middot; Calibrate</text>
        <text x="840" y="96" font-size="12.5" fill="var(--muted)">RAPL + wall meter</text>
        <text x="840" y="120" font-size="12.5" fill="var(--muted)">offline &middot; occasional</text>
        <text x="840" y="144" font-size="12.5" fill="var(--muted)">bare metal only</text>
        <text x="840" y="168" font-size="12" font-style="italic" fill="var(--tier3)">real joules, real hardware</text>

        <!-- Arrows: tiers -> Finding -->
        <polyline points="210,210 210,260 500,260 500,340" fill="none" stroke="var(--ink)" stroke-width="1.75" marker-end="url(#arrow)"></polyline>
        <text x="330" y="250" font-size="12" fill="var(--muted)" text-anchor="middle">shape + location</text>

        <polyline points="600,210 600,340" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="3 5" opacity="0.6" marker-end="url(#arrow)"></polyline>
        <text x="615" y="272" font-size="12" fill="var(--muted)" opacity="0.7">reserved slot</text>
        <text x="615" y="288" font-size="12" fill="var(--muted)" opacity="0.7">(not wired up)</text>

        <polyline points="990,210 990,260 700,260 700,340" fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-dasharray="6 4" marker-end="url(#arrow)"></polyline>
        <text x="870" y="250" font-size="12" fill="var(--muted)" text-anchor="middle">ratio (if measured)</text>

        <!-- Finding -->
        <rect x="450" y="340" width="300" height="150" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"></rect>
        <text x="470" y="372" font-size="16" font-weight="700" fill="var(--ink)">Finding</text>
        <text x="470" y="398" font-size="13" fill="var(--muted)">shape + location</text>
        <text x="470" y="420" font-size="13" fill="var(--muted)" opacity="0.55">+ confirmed counts (planned)</text>
        <text x="470" y="442" font-size="13" fill="var(--muted)">+ measured ratio (if available)</text>
        <text x="470" y="468" font-size="13" font-weight="600" fill="var(--ink)">tagged with its source tier</text>

        <!-- Finding -> CLI -->
        <line x1="600" y1="490" x2="600" y2="540" stroke="var(--ink)" stroke-width="1.75" marker-end="url(#arrow)"></line>

        <!-- CLI Output -->
        <rect x="420" y="540" width="360" height="80" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"></rect>
        <text x="600" y="572" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">CLI Output</text>
        <text x="600" y="596" font-size="13" fill="var(--muted)" text-anchor="middle">JSON Lines &middot; SARIF</text>

        <!-- CLI -> consumers -->
        <line x1="600" y1="620" x2="290" y2="690" stroke="var(--ink)" stroke-width="1.75" marker-end="url(#arrow)"></line>
        <text x="420" y="655" font-size="12" fill="var(--muted)" text-anchor="middle">for a developer</text>

        <line x1="600" y1="620" x2="910" y2="690" stroke="var(--ink)" stroke-width="1.75" marker-end="url(#arrow)"></line>
        <text x="780" y="655" font-size="12" fill="var(--muted)" text-anchor="middle">for a generating agent</text>

        <!-- Human -->
        <rect x="150" y="690" width="280" height="90" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"></rect>
        <text x="290" y="725" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">Human</text>
        <text x="290" y="748" font-size="13" fill="var(--muted)" text-anchor="middle">reads it in the editor</text>

        <!-- Agent -->
        <rect x="770" y="690" width="280" height="90" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"></rect>
        <text x="910" y="725" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">Agent</text>
        <text x="910" y="748" font-size="13" fill="var(--muted)" text-anchor="middle">via MCP or a CLI pipe</text>

      </g>
    </svg>
  </div>
  <figcaption>Two tiers exist today &mdash; static shape and offline calibration &mdash; with a reserved, not-yet-built slot for deterministic confirmation. Every <strong>Finding</strong> carries the tier it came from &mdash; never blended silently &mdash; before reaching a human or an agent.</figcaption>
</figure>
