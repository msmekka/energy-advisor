<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="One tree-sitter engine with two grammar slots. Python's slot is filled in: the grammar is wired up and energy rules are written against it. The other slot, covering Go, Rust, JavaScript, and TypeScript, already parses in the AST explorer, but no energy rules have been written for it yet.">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/>
    </marker>
    <marker id="arrowB-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#FAFAF8"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">

    <!-- Python: built -->
    <rect x="120" y="100" width="260" height="150" rx="8" fill="#FFFFFF" stroke="#1B2430" stroke-width="2"/>
    <text x="250" y="138" font-size="17" font-weight="700" fill="#1B2430" text-anchor="middle">Python</text>
    <text x="250" y="163" font-size="12" fill="#5B6472" text-anchor="middle">grammar wired in</text>
    <text x="250" y="184" font-size="12" fill="#5B6472" text-anchor="middle">rule.scm queries written</text>
    <text x="250" y="212" font-size="12" font-style="italic" fill="#1B2430" text-anchor="middle">this project, today</text>

    <!-- Other languages: ghost slot -->
    <rect x="520" y="100" width="260" height="150" rx="8" fill="none" stroke="#5B6472" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="650" y="134" font-size="14" font-weight="600" fill="#5B6472" text-anchor="middle">Go &middot; Rust</text>
    <text x="650" y="154" font-size="14" font-weight="600" fill="#5B6472" text-anchor="middle">JS &middot; TS</text>
    <text x="650" y="178" font-size="12" fill="#5B6472" text-anchor="middle">already parses in the AST explorer</text>
    <text x="650" y="198" font-size="12" fill="#5B6472" text-anchor="middle">zero energy rules written</text>
    <text x="650" y="222" font-size="12" font-style="italic" fill="#5B6472" text-anchor="middle">planned &#8212; not built yet</text>

    <!-- Shared engine -->
    <rect x="250" y="300" width="400" height="90" rx="8" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="450" y="338" font-size="15" font-weight="700" fill="#1B2430" text-anchor="middle">tree-sitter engine</text>
    <text x="450" y="361" font-size="12" fill="#5B6472" text-anchor="middle">one parser, swappable grammars</text>

    <!-- Arrows -->
    <line x1="350" y1="300" x2="250" y2="250" stroke="#1B2430" stroke-width="1.75" marker-end="url(#arrowB)"/>
    <line x1="550" y1="300" x2="650" y2="250" stroke="#5B6472" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowB-muted)"/>

  </g>
</svg>
