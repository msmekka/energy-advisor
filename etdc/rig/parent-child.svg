<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" role="img" aria-label="Anatomy of one benchmark run on the rig. A committed manifest supplies frozen N, warmup and HIT_AT per pair plus R per pair and per arm and a pinned interpreter path. The parent campaign runner, on its own core, reads the manifest, interleaves arms, and spawns one child per run under taskset with a minimal environment. The child is a fresh interpreter on the pinned core: it loads the fixture by path, discovers RAPL domains, builds the data and warms up, all before the measured window and each step separately timed. Only the RAPL start, the R-iteration work loop, and the RAPL stop sit inside the window, so interpreter startup never enters it. The child writes one single-line JSON object; the parent checks the child's reported interpreter against the manifest, adds rig provenance, a sequence number and a timestamp, and appends one row per run to an append-only JSONL. Arms are interleaved rather than blocked in time, and the ratio is computed per adjacent pair.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1090" fill="#FAFAF8"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">

    <!-- Manifest -->
    <rect x="40" y="40" width="300" height="150" rx="6" fill="#ECE8F3" stroke="#6B5B95" stroke-width="2"/>
    <text x="60" y="72" font-size="15" font-weight="600" fill="#1B2430">Manifest</text>
    <text x="60" y="98" font-size="12.5" fill="#5B6472">N, warmup, HIT_AT per pair</text>
    <text x="60" y="120" font-size="12.5" fill="#5B6472">R per pair AND per arm</text>
    <text x="60" y="142" font-size="12.5" fill="#5B6472">pinned interpreter path</text>
    <text x="60" y="162" font-size="12" font-style="italic" fill="#6B5B95">frozen and committed &#8212;</text>
    <text x="60" y="178" font-size="12" font-style="italic" fill="#6B5B95">never autotuned per run</text>

    <!-- Parent -->
    <rect x="380" y="40" width="780" height="150" rx="6" fill="#E4EEF2" stroke="#2E6F8E" stroke-width="2"/>
    <text x="400" y="72" font-size="15" font-weight="600" fill="#1B2430">Parent &#183; campaign runner</text>
    <text x="1140" y="72" font-size="12" font-style="italic" fill="#2E6F8E" text-anchor="end">its own core, not the pinned one</text>
    <text x="400" y="100" font-size="12.5" fill="#5B6472">reads the manifest</text>
    <text x="400" y="122" font-size="12.5" fill="#5B6472">interleaves the arms</text>
    <text x="400" y="144" font-size="12.5" fill="#5B6472">spawns one child per run</text>
    <text x="400" y="166" font-size="12.5" fill="#5B6472">kills on timeout, never retries in place</text>
    <text x="790" y="100" font-size="12.5" fill="#5B6472">asserts child runtime vs. manifest</text>
    <text x="790" y="122" font-size="12.5" fill="#5B6472">adds rig provenance</text>
    <text x="790" y="144" font-size="12.5" fill="#5B6472">appends the row, with seq and time</text>
    <text x="790" y="166" font-size="12.5" fill="#5B6472">a failure is a row, not a gap</text>

    <!-- spawn -->
    <line x1="700" y1="190" x2="700" y2="256" stroke="#1B2430" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="720" y="208" font-size="11.5" fill="#1B2430">taskset -c 1 python3 -s -m etdc.rig.harness FIXTURE</text>
    <text x="720" y="226" font-size="11.5" fill="#5B6472">--n N --r R --warmup W --out run.json</text>
    <text x="720" y="244" font-size="11.5" fill="#5B6472">env: PATH + PYTHONHASHSEED=0 &#183; cwd: repo root</text>

    <!-- Fixture -->
    <rect x="40" y="320" width="240" height="180" rx="6" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="60" y="352" font-size="15" font-weight="600" fill="#1B2430">Fixture</text>
    <text x="60" y="378" font-size="12.5" fill="#5B6472">build(n)</text>
    <text x="60" y="400" font-size="12.5" fill="#5B6472">work(data)</text>
    <text x="60" y="422" font-size="12.5" fill="#5B6472">__main__ guard</text>
    <text x="60" y="450" font-size="11.5" font-style="italic" fill="#2E6F8E">runnable on its own;</text>
    <text x="60" y="468" font-size="11.5" font-style="italic" fill="#2E6F8E">loaded here by path under a</text>
    <text x="60" y="486" font-size="11.5" font-style="italic" fill="#2E6F8E">name that is not __main__</text>
    <line x1="282" y1="410" x2="336" y2="410" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

    <!-- rapl.py -->
    <rect x="960" y="320" width="200" height="180" rx="6" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="980" y="352" font-size="14" font-weight="600" fill="#1B2430">rapl.py</text>
    <text x="980" y="378" font-size="12" fill="#5B6472">start(domains)</text>
    <text x="980" y="400" font-size="12" fill="#5B6472">stop(domains, mark)</text>
    <text x="980" y="428" font-size="11.5" font-style="italic" fill="#C1562C">counters &#8594; clock at</text>
    <text x="980" y="446" font-size="11.5" font-style="italic" fill="#C1562C">BOTH ends, so the read</text>
    <text x="980" y="464" font-size="11.5" font-style="italic" fill="#C1562C">overhead cancels</text>
    <text x="980" y="486" font-size="11.5" font-style="italic" fill="#5B6472">no total, no zeroes</text>
    <line x1="956" y1="566" x2="882" y2="566" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

    <!-- Child -->
    <rect x="340" y="260" width="560" height="450" rx="8" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="364" y="292" font-size="15" font-weight="600" fill="#1B2430">Child &#183; etdc/rig/harness.py</text>
    <text x="364" y="314" font-size="12" fill="#5B6472">fresh interpreter per run &#183; pinned core &#183; one fixture, one window</text>

    <!-- before the window -->
    <rect x="364" y="336" width="512" height="146" rx="6" fill="none" stroke="#5B6472" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="384" y="360" font-size="12" font-weight="600" fill="#5B6472">before the window &#8212; each step timed separately</text>
    <text x="384" y="386" font-size="12" fill="#5B6472">load fixture</text>
    <text x="760" y="386" font-size="12" fill="#1B2430">import_s</text>
    <text x="384" y="406" font-size="12" fill="#5B6472">discover_domains()</text>
    <text x="760" y="406" font-size="12" fill="#1B2430">one walk</text>
    <text x="384" y="426" font-size="12" fill="#5B6472">build(n)</text>
    <text x="760" y="426" font-size="12" fill="#1B2430">build_s</text>
    <text x="384" y="446" font-size="12" fill="#5B6472">warmup &#215; W</text>
    <text x="760" y="446" font-size="12" fill="#1B2430">warmup_s</text>
    <text x="384" y="466" font-size="12" fill="#5B6472">gc.collect()</text>
    <text x="760" y="466" font-size="11.5" font-style="italic" fill="#5B6472">GC stays on</text>

    <!-- the measured window -->
    <rect x="364" y="500" width="512" height="136" rx="6" fill="#F7E7DE" stroke="#C1562C" stroke-width="2.5"/>
    <text x="384" y="524" font-size="12.5" font-weight="600" fill="#C1562C">THE MEASURED WINDOW</text>
    <text x="384" y="552" font-size="12.5" fill="#1B2430">mark = rapl.start(domains)</text>
    <text x="384" y="574" font-size="12.5" fill="#1B2430">for _ in range(R): work(data)</text>
    <text x="384" y="596" font-size="12.5" fill="#1B2430">record = rapl.stop(domains, mark)</text>
    <text x="384" y="622" font-size="11" font-style="italic" fill="#C1562C">one call, one store &#8212; identical bytecode in both arms</text>

    <text x="364" y="660" font-size="11.5" font-style="italic" fill="#5B6472">~20&#8211;30 ms of interpreter startup never enters the window:</text>
    <text x="364" y="678" font-size="11.5" font-style="italic" fill="#5B6472">the child brackets itself, because the parent cannot.</text>
    <text x="364" y="700" font-size="12" font-weight="600" fill="#1B2430">&#8594; one JSON object, written to --out</text>

    <!-- child -> run.json -->
    <line x1="620" y1="710" x2="620" y2="748" stroke="#1B2430" stroke-width="1.75" marker-end="url(#arrow)"/>

    <!-- run.json -->
    <rect x="330" y="748" width="580" height="80" rx="8" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="620" y="776" font-size="13.5" font-weight="700" fill="#1B2430" text-anchor="middle">run.json &#8212; one line, concatenable</text>
    <text x="620" y="798" font-size="11" fill="#5B6472" text-anchor="middle">status &#183; n &#183; r &#183; warmup &#183; import_s &#183; build_s &#183; warmup_s &#183; duration_s</text>
    <text x="620" y="816" font-size="11" fill="#5B6472" text-anchor="middle">energy_uj{} &#183; avg_power_w{} &#183; runtime{} &#183; result_repr</text>

    <!-- run.json -> jsonl -->
    <line x1="620" y1="828" x2="620" y2="866" stroke="#1B2430" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="640" y="846" font-size="11.5" fill="#5B6472">parent checks runtime.version against the manifest</text>
    <text x="640" y="862" font-size="11.5" fill="#5B6472">mismatch &#8594; failed row, not a pooled one</text>

    <!-- campaign jsonl -->
    <rect x="330" y="866" width="580" height="88" rx="8" fill="#FFFFFF" stroke="#D8D4CB" stroke-width="1.5"/>
    <text x="620" y="894" font-size="14" font-weight="700" fill="#1B2430" text-anchor="middle">runs/campaign.jsonl</text>
    <text x="620" y="916" font-size="12" fill="#5B6472" text-anchor="middle">+ rig provenance: host &#183; CPU &#183; kernel &#183; governor &#183; turbo &#183; SMT</text>
    <text x="620" y="936" font-size="12" fill="#5B6472" text-anchor="middle">+ seq &#183; wall timestamp &#183; append-only, never an aggregate</text>

    <!-- interleave strip -->
    <text x="40" y="1000" font-size="12" font-weight="600" fill="#1B2430">arm order</text>
    <rect x="150" y="978" width="74" height="34" rx="4" fill="#F7E7DE" stroke="#C1562C" stroke-width="1.5"/>
    <text x="187" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">flag</text>
    <rect x="230" y="978" width="74" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F8E" stroke-width="1.5"/>
    <text x="267" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">no-flag</text>
    <rect x="310" y="978" width="74" height="34" rx="4" fill="none" stroke="#5B6472" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="347" y="1000" font-size="11" fill="#5B6472" text-anchor="middle">null</text>
    <rect x="390" y="978" width="74" height="34" rx="4" fill="#F7E7DE" stroke="#C1562C" stroke-width="1.5"/>
    <text x="427" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">flag</text>
    <rect x="470" y="978" width="74" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F8E" stroke-width="1.5"/>
    <text x="507" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">no-flag</text>
    <rect x="550" y="978" width="74" height="34" rx="4" fill="none" stroke="#5B6472" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="587" y="1000" font-size="11" fill="#5B6472" text-anchor="middle">null</text>
    <rect x="630" y="978" width="74" height="34" rx="4" fill="#F7E7DE" stroke="#C1562C" stroke-width="1.5"/>
    <text x="667" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">flag</text>
    <rect x="710" y="978" width="74" height="34" rx="4" fill="#FFFFFF" stroke="#2E6F8E" stroke-width="1.5"/>
    <text x="747" y="1000" font-size="11" fill="#1B2430" text-anchor="middle">no-flag</text>
    <text x="800" y="1000" font-size="12" fill="#5B6472">&#8230; one fresh process each</text>
    <text x="150" y="1042" font-size="11.5" fill="#5B6472">Interleaved, never blocked in time &#8212; thermal drift would otherwise alias directly onto the arm difference.</text>
    <text x="150" y="1060" font-size="11.5" fill="#5B6472">Same N across a pair&#8217;s arms; R may differ per arm, so ratios are formed from E/R.</text>

  </g>
</svg>
